# Vox config — re-read on every recording, no restart needed.

language = "en"
min_hold_ms = 350        # shorter Fn presses are ignored (emoji picker still works)
tail_ms = 250            # keep recording briefly after Fn release
warn_seconds = 25        # warning beep
max_seconds = 30         # auto-stop and transcribe (0 = no limit)
restore_clipboard = true
prompt_max_chars = 800   # Whisper prompt limit (~224 tokens)

start_sound = "/System/Library/Sounds/Tink.aiff"
stop_sound  = "/System/Library/Sounds/Pop.aiff"
warn_sound  = "/System/Library/Sounds/Funk.aiff"
error_sound = "/System/Library/Sounds/Basso.aiff"

# Tried in order until one succeeds.
[[providers]]
type = "groq"
model = "whisper-large-v3"
timeout_seconds = 5

[[providers]]
type = "groq"
model = "whisper-large-v3-turbo"
timeout_seconds = 5

[[providers]]
type = "deepgram"
model = "nova-3"
timeout_seconds = 15

# Vocabulary: sent as the Whisper prompt (Groq) and as keyterms (Deepgram).
terms = [
  "Viatrail",
  "MapLibre",
  "terrain-RGB",
  "NASADEM",
  "GeoTIFF",
  "Cloudflare",
  "R2",
  "Tailscale",
  "pinchy",
  "pinchy-mac-mini",
  "pinchy-laptop",
  "openclaw",
  "viatrail-pipeline",
  "pinchy-oracle",
  "AGENTS.md",
  "Mattermost",
  "tippecanoe",
  "Lucide",
  "Claude Code",
  "HiClaw",
  "Deepseek",
  "Hetzner",
  "iOS",
  "Maestro",
  "Claude",
  "Camofox",
  "kludge",
]

# Whole-word replacements applied to the transcript (case-insensitive unless case_sensitive = true).

[[replacements]]
from = "clawed"
to = "claude"

[[replacements]]
from = "Clawd"
to = "claude"

[[replacements]]
from = "matamos"
to = "mattermost"
