# Vox config — re-read on every recording, no restart needed.

language: en
min_hold_ms: 250        # shorter Fn presses are ignored (emoji picker still works)
double_tap_ms: 400      # two Fn taps this close together re-paste the last dictation (0 = off)
tail_ms: 250            # keep recording briefly after Fn release
warn_seconds: 25        # warning beep
max_seconds: 30         # auto-stop and transcribe (0 = no limit)
restore_clipboard: true
prompt_max_chars: 800   # Whisper prompt limit (~224 tokens)

# Silence detection. Whisper hallucinates words on silent audio, so recordings
# with less than min_speech_ms of audio louder than speech_rms aren't sent at all
# (nothing is pasted). The log prints each recording's
# level, so you can tune these to your mic.
speech_rms: 400         # 16-bit RMS per 20ms frame counted as speech
min_speech_ms: 200
no_speech_prob: 0.6     # Groq: drop segments Whisper rates as more likely non-speech (0 = off)

start_sound: /System/Library/Sounds/Tink.aiff
stop_sound:  /System/Library/Sounds/Pop.aiff
warn_sound:  /System/Library/Sounds/Funk.aiff
error_sound: /System/Library/Sounds/Basso.aiff
success_sound: ""       # after each paste ("" = silent)
fallback_sound: /System/Library/Sounds/Purr.aiff   # a provider failed and vox is trying the next ("" = silent)
# Volume per sound, 0..1 (default 1). Relative to your system output volume.
start_volume: 1
stop_volume: 1
warn_volume: 1
error_volume: 1
success_volume: 1
fallback_volume: 1
tick_sound: builtin     # quiet tick while waiting for the server: "builtin", a file path, or "" = off
tick_volume: 0.25       # 0..1, relative to the other sounds
tick_ms: 200

# Tried in order until one succeeds.
providers:
  - { type: groq,     model: whisper-large-v3,       timeout_seconds: 5 }
  - { type: groq,     model: whisper-large-v3-turbo, timeout_seconds: 5 }
  - { type: deepgram, model: nova-3,                 timeout_seconds: 15 }

# Vocabulary: sent as the Whisper prompt (Groq) and as keyterms (Deepgram).
terms:
  - "Kubernetes"
  - "PostgreSQL"
  - "Tailscale"
  - "Claude Code"
  - "GeoTIFF"

# Whole-word replacements applied to the transcript.
# Case-insensitive unless you add  case_sensitive: true
replacements:
  - { from: clawed, to: Claude }
  - { from: post gress, to: Postgres }
